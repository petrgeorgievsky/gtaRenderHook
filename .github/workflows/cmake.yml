name: CMake

on: [ push ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # TODO: Cleanup, improve build times
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Create Build Environment
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        run: cmake -E make_directory ${{runner.workspace}}/build_x64
          ${{runner.workspace}}/build_x86
          ${{runner.workspace}}/artifacts/gta3
          ${{runner.workspace}}/artifacts/gtavc
          ${{runner.workspace}}/artifacts/gtasa

      - name: Setup Vulkan
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true" -OutFile VulkanSDK.exe
          $installer = Start-Process -FilePath VulkanSDK.exe -Wait -PassThru -NoNewWindow -ArgumentList @("--accept-licenses", "--default-answer", "--confirm-command", "install");
          $installer.WaitForExit();
          if ( $installer.ExitCode -ne 0 ) {
            throw "Vulkan SDK installer failed with exit code $($installer.ExitCode)."
          }

          $sdkPath = Get-ChildItem "C:\\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if ( -not $sdkPath ) {
            throw "Unable to locate installed Vulkan SDK under C:\\VulkanSDK."
          }

          "VULKAN_SDK=$($sdkPath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdkPath.FullName)\\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Restore from cache the previously built ports. If cache-miss, download, build vcpkg.
      - name: Restore from cache and install vcpkg
        # Download and build vcpkg, without installing any port.
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          # Keep this baseline updated when ports break due upstream mirror/package changes.
          vcpkgGitCommitId: 73248d88e09d43dfd7836902462a64fd2a43387b
      # Now that vcpkg is installed, it is being used to run desired arguments.
      - run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if $VCPKG_ROOT/vcpkg install --binarysource=clear @response_file.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "vcpkg install failed on attempt $attempt, retrying..."
              sleep $((attempt * 15))
            fi
          done
          echo "vcpkg install failed after 3 attempts."
          exit 1
        shell: bash

      - name: Configure CMake x64
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        working-directory: ${{runner.workspace}}/build_x64
        # Note the current convention is to use the -S and -B options here to specify source
        # and build directories, but this is only available with CMake 3.13 and higher.
        # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
        run: cmake $GITHUB_WORKSPACE
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake
          -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /std:c++latest /W0 /WX- /GR /EHsc  /MT"
          -DARCH_64BIT=ON
          -DBUILD_32BIT_LIBS=ON
          -DGTA_3_FOLDER="${{runner.workspace}}\\artifacts\\gta3\\"
          -DGTA_VC_FOLDER="${{runner.workspace}}\\artifacts\\gtavc\\"
          -DGTA_SA_FOLDER="${{runner.workspace}}\\artifacts\\gtasa\\"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static -A x64

      - name: Build x64
        working-directory: ${{runner.workspace}}/build_x64
        shell: bash
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: cmake --build . --config $BUILD_TYPE --target gta_3_render_driver gta_vc_render_driver gta_sa_render_driver -- -p:TreatWarningsAsErrors=false

      - name: Configure CMake x86
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        working-directory: ${{runner.workspace}}/build_x86
        # Note the current convention is to use the -S and -B options here to specify source
        # and build directories, but this is only available with CMake 3.13 and higher.
        # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
        run: cmake $GITHUB_WORKSPACE
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake
          -DCMAKE_C_FLAGS="-m32"
          -DCMAKE_CXX_FLAGS="-m32 /DWIN32 /D_WINDOWS /std:c++latest /W0 /WX- /GR /EHsc  /MT"
          -DBUILD_32BIT_LIBS=ON
          -DGTA_3_FOLDER="${{runner.workspace}}\\artifacts\\gta3\\"
          -DGTA_VC_FOLDER="${{runner.workspace}}\\artifacts\\gtavc\\"
          -DGTA_SA_FOLDER="${{runner.workspace}}\\artifacts\\gtasa\\"
          -DVCPKG_TARGET_TRIPLET=x86-windows-static -A Win32

      - name: Build x86
        working-directory: ${{runner.workspace}}/build_x86
        shell: bash
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: cmake --build . --config $BUILD_TYPE --target gta_3_render_hook gta_vc_render_hook gta_sa_render_hook -- -p:TreatWarningsAsErrors=false

      - name: Artifacts GTA 3
        uses: actions/upload-artifact@v6
        with:
          name: gta3_rh
          path: ${{runner.workspace}}/artifacts/gta3

      - name: Artifacts GTA VC
        uses: actions/upload-artifact@v6
        with:
          name: gtavc_rh
          path: ${{runner.workspace}}/artifacts/gtavc

      - name: Artifacts GTA SA
        uses: actions/upload-artifact@v6
        with:
          name: gtasa_rh
          path: ${{runner.workspace}}/artifacts/gtasa
