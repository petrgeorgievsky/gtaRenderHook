name: CMake

on: [push]

env:
  BUILD_TYPE: RelWithDebInfo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create build and artifact directories
        shell: pwsh
        run: |
          cmake -E make_directory `
            "$env:GITHUB_WORKSPACE\build\x64" `
            "$env:GITHUB_WORKSPACE\build\x86" `
            "$env:GITHUB_WORKSPACE\artifacts\gta3" `
            "$env:GITHUB_WORKSPACE\artifacts\gtavc" `
            "$env:GITHUB_WORKSPACE\artifacts\gtasa"

      - name: Setup Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = Join-Path $env:RUNNER_TEMP 'VulkanSDK.exe'
          Invoke-WebRequest `
            -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true' `
            -OutFile $installerPath

          $installer = Start-Process `
            -FilePath $installerPath `
            -Wait `
            -PassThru `
            -NoNewWindow `
            -ArgumentList @('--accept-licenses', '--default-answer', '--confirm-command', 'install')

          if ($installer.ExitCode -ne 0) {
            throw "Vulkan SDK installer failed with exit code $($installer.ExitCode)."
          }

          $sdkPath = Get-ChildItem 'C:\VulkanSDK' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdkPath) {
            throw 'Unable to locate installed Vulkan SDK under C:\VulkanSDK.'
          }

          "VULKAN_SDK=$($sdkPath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdkPath.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore from cache and bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          # Keep this baseline updated when ports break due upstream mirror/package changes.
          vcpkgGitCommitId: 73248d88e09d43dfd7836902462a64fd2a43387b

      - name: Install vcpkg dependencies
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $responseFile = '@response_file.txt'

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & "$env:VCPKG_ROOT\vcpkg.exe" install '--binarysource=clear' $responseFile
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt 3) {
              Write-Warning "vcpkg install failed on attempt $attempt, retrying..."
              Start-Sleep -Seconds ($attempt * 15)
            }
          }

          throw 'vcpkg install failed after 3 attempts.'

      - name: Configure CMake x64
        shell: pwsh
        run: |
          cmake `
            -S "$env:GITHUB_WORKSPACE" `
            -B "$env:GITHUB_WORKSPACE\build\x64" `
            -G 'Visual Studio 18 2026' `
            -A x64 `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_CXX_FLAGS='/DWIN32 /D_WINDOWS /std:c++latest /W0 /WX- /GR /EHsc /MT' `
            -DARCH_64BIT=ON `
            -DBUILD_32BIT_LIBS=ON `
            -DGTA_3_FOLDER="$env:GITHUB_WORKSPACE\artifacts\gta3\" `
            -DGTA_VC_FOLDER="$env:GITHUB_WORKSPACE\artifacts\gtavc\" `
            -DGTA_SA_FOLDER="$env:GITHUB_WORKSPACE\artifacts\gtasa\" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build x64 render drivers
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build\x64" `
            --config "$env:BUILD_TYPE" `
            --parallel `
            --target gta_3_render_driver gta_vc_render_driver gta_sa_render_driver `
            -- /p:TreatWarningsAsErrors=false

      - name: Configure CMake x86
        shell: pwsh
        run: |
          cmake `
            -S "$env:GITHUB_WORKSPACE" `
            -B "$env:GITHUB_WORKSPACE\build\x86" `
            -G 'Visual Studio 18 2026' `
            -A Win32 `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_CXX_FLAGS='/DWIN32 /D_WINDOWS /std:c++latest /W0 /WX- /GR /EHsc /MT' `
            -DBUILD_32BIT_LIBS=ON `
            -DGTA_3_FOLDER="$env:GITHUB_WORKSPACE\artifacts\gta3\" `
            -DGTA_VC_FOLDER="$env:GITHUB_WORKSPACE\artifacts\gtavc\" `
            -DGTA_SA_FOLDER="$env:GITHUB_WORKSPACE\artifacts\gtasa\" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static

      - name: Build x86 render hooks
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build\x86" `
            --config "$env:BUILD_TYPE" `
            --parallel `
            --target gta_3_render_hook gta_vc_render_hook gta_sa_render_hook `
            -- /p:TreatWarningsAsErrors=false

      - name: Artifacts GTA 3
        uses: actions/upload-artifact@v6
        with:
          name: gta3_rh
          path: ${{ github.workspace }}\artifacts\gta3
          if-no-files-found: error

      - name: Artifacts GTA VC
        uses: actions/upload-artifact@v6
        with:
          name: gtavc_rh
          path: ${{ github.workspace }}\artifacts\gtavc
          if-no-files-found: error

      - name: Artifacts GTA SA
        uses: actions/upload-artifact@v6
        with:
          name: gtasa_rh
          path: ${{ github.workspace }}\artifacts\gtasa
          if-no-files-found: error
